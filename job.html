<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Captiva job files</title>
<!-- BUILT FILE: edit job.src.html and run `node build_job_page.js`. The camera section is copied from
     index.html (the checklist page) so both pages always share the same camera code. -->
<style>
  :root { --blue:#1a73e8; --ink:#202124; --mute:#5f6368; --line:#e3e5e8; --bg:#f4f5f7; --ok:#188038; --bad:#c5221f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px 10px; }
  header h1 { font-size:18px; margin:0 0 2px; line-height:1.25; }
  header .sub { color:var(--mute); font-size:14px; }
  header a { color:var(--blue); }
  main { padding:12px 12px 130px; max-width:680px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; margin:0 0 12px; overflow:hidden; }
  .card h2 { font-size:15px; margin:0; padding:12px 14px; background:#fafbfc; border-bottom:1px solid var(--line); }
  .card h2 small { font-weight:400; color:var(--mute); }
  .pad { padding:12px 14px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:10px; padding:15px; font-size:17px; font-weight:600; background:var(--blue); color:#fff; }
  .btn.alt { background:#e8f0fe; color:var(--blue); margin-top:8px; font-weight:500; font-size:15px; padding:12px; }
  .btn:disabled { background:#c4c7cc; color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; margin-top:12px; }
  .th { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:#dfe1e5; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--mute); }
  .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .st { position:absolute; left:4px; bottom:4px; font-size:11px; padding:2px 6px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; }
  .st.bad { background:var(--bad); }
  .x { position:absolute; right:3px; top:3px; width:26px; height:26px; border-radius:13px; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:16px; line-height:26px; padding:0; }
  .doc { position:relative; display:flex; align-items:center; gap:10px; padding:10px 40px 10px 10px; border:1px solid var(--line); border-radius:8px; margin-top:8px; }
  .doc .ic { flex:0 0 36px; height:44px; border-radius:6px; background:#e8f0fe; color:var(--blue); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; text-transform:uppercase; overflow:hidden; }
  .doc .nm { flex:1; min-width:0; word-break:break-word; font-size:14px; }
  .doc .nm small { display:block; color:var(--mute); }
  .doc .nm small.bad { color:var(--bad); }
  .doc .x { top:50%; margin-top:-13px; right:8px; }
  textarea { width:100%; min-height:64px; border:1px solid #c4c7cc; border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  footer { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  footer .inner { max-width:680px; margin:0 auto; }
  footer .note { font-size:13px; color:var(--mute); text-align:center; margin-bottom:6px; min-height:16px; }
  .diag { font-size:11px; color:#9aa0a6; text-align:center; margin:18px 0 0; word-break:break-word; }
  .switch { text-align:center; margin:14px 0 0; font-size:14px; }
  .switch a { color:var(--blue); }
  /* camera overlay (same as the checklist page) */
  #cam { position:fixed; inset:0; z-index:20; background:#000; display:none; flex-direction:column; overflow:hidden; }
  #cam.show { display:flex; }
  #cam video { flex:1; width:100%; height:100%; object-fit:cover; background:#000; }
  #cam .top { position:absolute; top:0; left:0; right:0; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; color:#fff; font-size:16px; font-weight:600; text-align:center; background:linear-gradient(rgba(0,0,0,.55),transparent); }
  #cam .bot { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between; padding:18px 22px calc(22px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,rgba(0,0,0,.6)); }
  #shutter { width:78px; height:78px; border-radius:50%; border:5px solid #fff; background:rgba(255,255,255,.25); padding:0; }
  #shutter:active { background:#fff; }
  #camLast { width:56px; height:56px; border-radius:8px; border:2px solid #fff; background:#333 center/cover no-repeat; color:#fff; font-weight:700; display:flex; align-items:flex-end; justify-content:flex-end; padding:2px 4px; font-size:14px; }
  #camDone { min-width:72px; height:48px; border-radius:24px; border:0; background:#fff; color:#000; font-weight:700; font-size:16px; padding:0 16px; }
  #lensBar { position:absolute; left:0; right:0; bottom:calc(126px + env(safe-area-inset-bottom)); display:none; justify-content:center; align-items:center; gap:12px; pointer-events:none; }
  #lensBar button { pointer-events:auto; width:44px; height:44px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:13px; font-weight:700; padding:0; }
  #lensBar button.on { width:52px; height:52px; color:#ffd60a; font-size:16px; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .15s; }
  .done-screen { text-align:center; padding:56px 20px; }
  .done-screen .tick { width:72px; height:72px; border-radius:50%; background:var(--ok); margin:0 auto 16px; position:relative; }
  .done-screen .tick::after { content:""; position:absolute; left:26px; top:14px; width:16px; height:32px; border:solid #fff; border-width:0 6px 6px 0; transform:rotate(45deg); }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:110px; background:#323232; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; z-index:30; display:none; max-width:90%; text-align:center; }
</style>
</head>
<body>
<div id="app"></div>
<div id="cam">
  <video id="camVideo" playsinline autoplay muted></video>
  <div id="flash"></div>
  <div class="top" id="camTitle">Photos</div>
  <div id="lensBar"></div>
  <div class="bot">
    <div id="camLast"></div>
    <button id="shutter" aria-label="Take photo"></button>
    <button id="camDone">Done</button>
  </div>
</div>
<input id="fileCam" type="file" accept="image/*" capture="environment" style="display:none">
<input id="fileLib" type="file" accept="image/*" multiple style="display:none">
<input id="fileDoc" type="file" multiple style="display:none">
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var MAX_SIDE = 2048, QUALITY = 0.85, PARALLEL = 2, MAX_DOC = 20 * 1024 * 1024;
  var LINK = null, API = '', MODE = 'photos', M = null, WHO = null, WHO_KEY = 'captiva-who';
  var state = { photos: [], docs: [], note: '', seq: 0, finishing: false, finished: null, logged: '', session: '' };
  var camMode = 'unknown', camError = '', stream = null;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function rid() { var a = new Uint8Array(12); (window.crypto || window.msCrypto).getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(36)).slice(-2); }).join(''); }
  function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, ms || 2500); }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  // ---------- server ----------
  function body(fn, args) {
    args = args || {};
    if (WHO) args.who = WHO.email;
    args.session = state.session; args.kind = MODE;
    return JSON.stringify({ fn: fn, k: LINK, args: args });
  }
  function post(fn, args) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body(fn, args) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.error || 'failed'); e.code = j.error; throw e; } return j.result; });
  }

  // ---------- lists ----------
  function items() { return MODE === 'photos' ? state.photos : state.docs; }
  function counts() {
    var live = items().filter(function (p) { return !p.removed; });
    return {
      all: live.length,
      saved: live.filter(function (p) { return p.status === 'saved'; }).length,
      pending: live.filter(function (p) { return p.status === 'uploading' || p.status === 'queued' || p.status === 'reading'; }).length,
      failed: live.filter(function (p) { return p.status === 'failed'; }).length
    };
  }
  function savedIds() { return items().filter(function (p) { return !p.removed && p.status === 'saved' && p.id; }).map(function (p) { return p.id; }); }
  /** What a Finish would log now — used to know whether there is anything new to log. */
  function logSig() { return savedIds().join(',') + '|' + state.note.trim(); }

  // ---------- render ----------
  function render() {
    if (state.finished) return renderDone();
    var photos = MODE === 'photos', h = [];
    h.push('<header><h1>' + (photos ? 'Add photos' : 'Add documents') + '</h1><div class="sub">' + esc(M.job) +
      (M.address ? ' &middot; ' + esc(M.address) : '') +
      (WHO ? ' &middot; ' + esc(WHO.name.split(' ')[0]) + ' <a href="#" id="changeWho">change</a>' : '') + '</div></header><main>');
    if (photos) {
      h.push('<div class="card"><h2>Photos <small>&middot; go to the PICTURES folder</small></h2><div class="pad">');
      h.push('<button class="btn" id="takeBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>Take photos</button>');
      h.push('<button class="btn alt" id="libBtn">Add from phone&rsquo;s photos</button>');
      h.push('<div class="grid" id="grid"></div></div></div>');
    } else {
      h.push('<div class="card"><h2>Documents <small>&middot; go to the DOCUMENTS folder</small></h2><div class="pad">');
      h.push('<button class="btn" id="docBtn">Choose files</button>');
      h.push('<p style="color:#5f6368;font-size:13px;margin:8px 0 0">Any file type &middot; up to 20 MB each</p>');
      h.push('<div id="docList"></div></div></div>');
    }
    h.push('<div class="card"><h2>Note <small>&middot; optional</small></h2><div class="pad"><textarea id="note" placeholder="What are these?">' + esc(state.note) + '</textarea></div></div>');
    h.push('<p class="switch"><a href="#" id="switchMode">' + (photos ? 'Add documents instead' : 'Add photos instead') + '</a></p>');
    h.push('<p class="diag" id="diag"></p></main>');
    h.push('<footer><div class="inner"><div class="note" id="footNote"></div><button class="btn" id="finishBtn">Finish</button></div></footer>');
    $('app').innerHTML = h.join('');
    if (photos) {
      $('takeBtn').addEventListener('click', openCamera);
      $('libBtn').addEventListener('click', function () { $('fileLib').click(); });
    } else {
      $('docBtn').addEventListener('click', function () { $('fileDoc').click(); });
    }
    $('note').addEventListener('input', function () { state.note = $('note').value; });
    $('finishBtn').addEventListener('click', finish);
    $('changeWho').addEventListener('click', function (e) { e.preventDefault(); pickWho(true, render); });
    $('switchMode').addEventListener('click', function (e) {
      e.preventDefault();
      if (counts().pending) return toast('Wait for the uploads to finish first.');
      flush(false);
      MODE = photos ? 'docs' : 'photos'; newSession(); render();
    });
    renderItems(); renderStatus();
  }
  function renderItems() {
    if (MODE === 'photos') {
      var g = $('grid'); if (!g) return;
      g.innerHTML = state.photos.map(function (p, i) {
        if (p.removed) return '';
        var st = p.status === 'saved' ? 'Saved' : p.status === 'failed' ? 'Tap to retry' : 'Uploading…';
        return '<div class="th" data-i="' + i + '">' + (p.thumb ? '<img src="' + p.thumb + '" alt="">' : 'Photo') +
          '<span class="st' + (p.status === 'failed' ? ' bad' : '') + '">' + st + '</span><button class="x" data-x="' + i + '" aria-label="Remove">&times;</button></div>';
      }).join('');
      bindItems(g, '.th');
    } else {
      var l = $('docList'); if (!l) return;
      l.innerHTML = state.docs.map(function (d, i) {
        if (d.removed) return '';
        var ext = (String(d.name).match(/\.([A-Za-z0-9]{1,5})$/) || ['', 'file'])[1];
        var st = d.status === 'saved' ? 'Saved' : d.status === 'failed' ? (d.err || 'Did not upload') + ' — tap to retry' : 'Uploading…';
        return '<div class="doc" data-i="' + i + '"><div class="ic">' + esc(ext) + '</div><div class="nm">' + esc(d.name) +
          '<small' + (d.status === 'failed' ? ' class="bad"' : '') + '>' + esc(st) + '</small></div><button class="x" data-x="' + i + '" aria-label="Remove">&times;</button></div>';
      }).join('');
      bindItems(l, '.doc');
    }
  }
  function bindItems(root, sel) {
    Array.prototype.forEach.call(root.querySelectorAll('.x'), function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); removeItem(+b.getAttribute('data-x')); }); });
    Array.prototype.forEach.call(root.querySelectorAll(sel), function (el) {
      el.addEventListener('click', function () {
        var p = items()[+el.getAttribute('data-i')];
        if (p && p.status === 'failed' && p.data) { p.status = 'queued'; p.tries = 0; pump(); renderItems(); renderStatus(); }
      });
    });
  }
  function camInfo() {
    try { var v = $('camVideo'), t = stream && stream.getVideoTracks()[0]; return (v && v.videoWidth ? ' · ' + v.videoWidth + '×' + v.videoHeight : '') + (t && t.label ? ' · ' + t.label : ''); } catch (e) { return ''; }
  }
  function renderStatus() {
    var c = counts(), noun = MODE === 'photos' ? 'photo' : 'file';
    var note = '';
    if (c.pending) note = 'Uploading ' + plural(c.pending, noun) + '… keep this page open';
    else if (c.failed) note = plural(c.failed, noun) + ' did not upload — tap to retry';
    else if (c.saved) note = plural(c.saved, noun) + ' saved to the job folder';
    if ($('footNote')) $('footNote').textContent = note;
    if ($('finishBtn')) { $('finishBtn').disabled = state.finishing || c.pending > 0; $('finishBtn').textContent = state.finishing ? 'Finishing…' : 'Finish'; }
    if ($('diag')) $('diag').textContent = MODE === 'photos' ? 'Camera: ' + camMode + (camError ? ' (' + camError + ')' : '') +
      (camMode === 'live' ? ' · lens ' + lens.cur + 'x' : '') + ' · tier ' + camTier + camInfo() + ' · ' + M.job : M.job;
    if ($('camTitle')) $('camTitle').textContent = plural(c.all, 'photo') + (c.pending ? ' · uploading' : '');
  }
  function renderDone() {
    var r = state.finished, photos = MODE === 'photos';
    $('app').innerHTML = '<div class="done-screen"><div class="tick"></div><h1 style="font-size:22px;margin:0 0 8px">' +
      plural(r.count, photos ? 'photo' : 'document') + ' saved</h1>' +
      '<p style="color:#5f6368;margin:0 0 6px">' + esc(M.job) + ' · ' + (photos ? 'PICTURES' : 'DOCUMENTS') + ' folder</p>' +
      '<button class="btn alt" id="moreBtn" style="margin-top:22px">Add more</button>' +
      '<p style="color:#5f6368;margin-top:22px">You can close this page.</p></div>';
    $('moreBtn').addEventListener('click', function () { state.finished = null; render(); if (photos) openCamera(); });
  }
  function renderMessage(title, msg) {
    $('app').innerHTML = '<div class="done-screen"><h1 style="font-size:21px;margin:0 0 10px">' + esc(title) + '</h1><p style="color:#5f6368">' + esc(msg) + '</p></div>';
  }

  // ---------- uploads ----------
  function addPhoto(dataUrl, thumb, takenAt) {
    state.photos.push({ clientId: rid(), seq: ++state.seq, data: dataUrl, thumb: thumb, takenAt: takenAt, status: 'queued', tries: 0, id: null });
    pump(); renderItems(); renderStatus();
  }
  function addDoc(file) {
    if (file.size > MAX_DOC) { toast(file.name + ' is over 20 MB. Ask the office to put it in the job’s Drive folder.', 5000); return; }
    var d = { clientId: rid(), name: file.name || 'file', mime: file.type || '', data: null, status: 'reading', tries: 0, id: null };
    state.docs.push(d); renderItems(); renderStatus();
    var r = new FileReader();
    r.onload = function () { d.data = r.result; d.status = 'queued'; pump(); renderItems(); renderStatus(); };
    r.onerror = function () { d.status = 'failed'; d.err = 'Could not read the file'; renderItems(); renderStatus(); };
    r.readAsDataURL(file);
  }
  function pump() {
    var list = items(), busy = list.filter(function (p) { return p.status === 'uploading'; }).length;
    list.forEach(function (p) {
      if (busy >= PARALLEL || p.status !== 'queued' || p.removed) return;
      busy++; p.status = 'uploading'; p.tries++;
      var args = MODE === 'photos'
        ? { clientId: p.clientId, seq: p.seq, b64: p.data, thumb: p.thumb, takenAt: p.takenAt }
        : { clientId: p.clientId, b64: p.data, name: p.name, mime: p.mime };
      post('upload', args).then(function (r) {
        p.id = r.id; p.status = 'saved'; p.data = null;
        if (p.removed) post('delete', { fileId: p.id }).catch(function () {});
      }).catch(function (e) {
        var hard = e && e.code && /too large|missing/i.test(e.code);
        p.status = hard || p.tries >= 3 ? 'failed' : 'queued';
        p.err = hard ? e.code : '';
        if (p.status === 'queued') return new Promise(function (ok) { setTimeout(ok, 1500 * p.tries); });
      }).then(function () { pump(); renderItems(); renderStatus(); });
    });
  }
  function removeItem(i) {
    var p = items()[i]; if (!p) return;
    if (!confirm(MODE === 'photos' ? 'Remove this photo?' : 'Remove this file?')) return;
    p.removed = true;
    if (p.id) post('delete', { fileId: p.id }).catch(function () {});
    renderItems(); renderStatus();
  }

  // ---------- finish / auto-log ----------
  function finish() {
    var c = counts();
    if (c.failed && !confirm(plural(c.failed, MODE === 'photos' ? 'photo' : 'file') + ' did not upload and will be left out. Finish anyway?')) return;
    if (!c.saved && !state.note.trim()) return toast(MODE === 'photos' ? 'Take or add a photo first.' : 'Choose a file first.');
    state.finishing = true; renderStatus();
    var sig = logSig();
    post('finish', { fileIds: savedIds(), note: state.note }).then(function (r) {
      state.finishing = false; state.logged = sig;
      state.finished = { count: r.count };
      if (stream) closeCamera();
      render();
    }).catch(function () {
      state.finishing = false; renderStatus();
      toast('Your files are saved. The log will update when you have signal — tap Finish again.', 4500);
    });
  }
  /** Leaving the page (or switching photos/documents) logs the visit even without tapping Finish. */
  function flush(beacon) {
    if (!M || !LINK || logSig() === state.logged || !savedIds().length) return;
    var b = body('finish', { fileIds: savedIds(), note: state.note });
    state.logged = logSig();
    if (beacon && navigator.sendBeacon) { try { navigator.sendBeacon(API, new Blob([b], { type: 'text/plain;charset=utf-8' })); return; } catch (e) {} }
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: b, keepalive: true }).catch(function () {});
  }
  function newSession() { state.session = rid(); state.seq = 0; state.logged = ''; state.photos = []; state.docs = []; state.note = ''; state.finished = null; }
  window.addEventListener('pagehide', function () { flush(true); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && !counts().pending) flush(true); });
  window.addEventListener('beforeunload', function (e) { if (counts().pending) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- documents picker ----------
  $('fileDoc').addEventListener('change', function (e) { Array.prototype.forEach.call(e.target.files || [], addDoc); e.target.value = ''; });

  // ===== camera: copied from index.html by build_job_page.js — do not edit here =====
  /** Draw a video frame or image into a JPEG no larger than MAX_SIDE; returns {data, thumb}. */
  function encode(src, w, h, zoom) {
    zoom = zoom || 1;   // 2 = centre crop (the 2x lens button)
    var sw = w / zoom, sh = h / zoom;
    var s = Math.min(1, MAX_SIDE / Math.max(sw, sh));
    var c = document.createElement('canvas'); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
    c.getContext('2d').drawImage(src, (w - sw) / 2, (h - sh) / 2, sw, sh, 0, 0, c.width, c.height);
    var data = c.toDataURL('image/jpeg', QUALITY);
    var ts = 180 / Math.max(c.width, c.height), t = document.createElement('canvas');
    t.width = Math.round(c.width * ts); t.height = Math.round(c.height * ts);
    t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
    return { data: data, thumb: t.toDataURL('image/jpeg', 0.7) };
  }

  // ---------- lens picker (.5x ultra wide / 1x / 2x) ----------
  // iPhones list each back lens as its own camera once the camera is allowed.
  // .5x = the Ultra Wide lens; 1x = the main lens; 2x = centre crop of the main lens.
  // The camera ALWAYS opens on 1x; the lens is not remembered (10/1: a remembered .5x opened black on
  // Nathan's iPhone 17 Pro Max). The old saved setting is cleared from phones that have it.
  var LENS_KEY = 'captiva-lens';
  try { localStorage.removeItem(LENS_KEY); } catch (e) {}
  var lens = { cur: '1', mainId: '', ultraId: '', busy: false, labels: '', ultraBad: false };
  function savedLens() { return '1'; }
  function saveLens(z) {}
  // Camera "tier": 0 = full resolution, 1 = 1920 wide, 2 = plain back camera (no size, no lens pick),
  // 3 = the phone's own camera app. If the live picture is black/frozen the page steps down a tier.
  // The working tier is remembered on the phone for 7 days (it's about the phone, not a choice).
  var TIER_KEY = 'captiva-cam-tier', camTier = 0;
  try { var tk = JSON.parse(localStorage.getItem(TIER_KEY) || 'null'); if (tk && Date.now() - tk.at < 7 * 864e5) camTier = tk.tier | 0; } catch (e) {}
  function saveTier() { try { localStorage.setItem(TIER_KEY, JSON.stringify({ tier: camTier, at: Date.now() })); } catch (e) {} }
  function camConstraints(id) {
    var v = camTier === 0 ? { width: { ideal: 4096 }, height: { ideal: 3072 } } : camTier === 1 ? { width: { ideal: 1920 }, height: { ideal: 1440 } } : {};
    if (id && camTier < 2) v.deviceId = { exact: id }; else v.facingMode = { ideal: 'environment' };
    return { audio: false, video: v };
  }
  function startId() {
    return (lens.cur === '0.5' && lens.ultraId) ? lens.ultraId : (lens.mainId || null);
  }
  function trackId() {
    var t = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
    return t && t.getSettings ? (t.getSettings().deviceId || '') : '';
  }
  function camShowing() { return $('cam').classList.contains('show'); }
  function findLenses() {
    if (!navigator.mediaDevices.enumerateDevices) { if (!lens.mainId) lens.mainId = trackId(); return Promise.resolve(); }
    return navigator.mediaDevices.enumerateDevices().then(function (ds) {
      var main = '', ultra = '', names = [];
      ds.forEach(function (d) {
        var l = d.label || '';
        if (d.kind !== 'videoinput') return;
        names.push(l || '?');
        if (!l || /front|frontal|delantera|facetime/i.test(l)) return;
        if (/ultra/i.test(l)) { if (!ultra) ultra = d.deviceId; return; }
        if (/tele|dual|doble|dupla|triple|tripla|triplo/i.test(l)) return;
        if (!main) main = d.deviceId;
      });
      lens.ultraId = (lens.ultraBad || camTier >= 2) ? '' : ultra;
      lens.mainId = main || lens.mainId || trackId();
      lens.labels = names.join(', ');
    }).catch(function () { if (!lens.mainId) lens.mainId = trackId(); });
  }
  function paintLens() {
    var bar = $('lensBar'), v = $('camVideo');
    v.style.transform = lens.cur === '2' ? 'scale(2)' : '';
    if (!bar) return;
    var opts = lens.ultraId ? ['0.5', '1', '2'] : ['1', '2'];
    bar.innerHTML = opts.map(function (z) {
      var on = z === lens.cur, txt = (z === '0.5' ? '.5' : z) + (on ? '×' : '');
      return '<button type="button" data-z="' + z + '"' + (on ? ' class="on"' : '') + ' aria-label="' + z + 'x lens">' + txt + '</button>';
    }).join('');
    bar.style.display = stream ? 'flex' : 'none';
  }
  function setLens(z, force) {
    if (lens.busy || !stream) return;
    if (z === lens.cur && !force) return;
    if (z === '0.5' && !lens.ultraId) z = '1';
    var id = z === '0.5' ? lens.ultraId : lens.mainId;
    saveLens(z);
    if (!id || id === trackId()) { lens.cur = z; paintLens(); return; }
    lens.busy = true;
    var v = $('camVideo');
    stream.getTracks().forEach(function (t) { t.stop(); });   // iPhone runs one camera at a time
    navigator.mediaDevices.getUserMedia(camConstraints(id)).then(null, function () {
      z = '1'; return navigator.mediaDevices.getUserMedia(camConstraints(lens.mainId || null));
    }).then(function (s) {
      lens.busy = false;
      if (!camShowing()) { s.getTracks().forEach(function (t) { t.stop(); }); stream = null; return; }
      useStream(s);
      lens.cur = z; paintLens();
      if (z === '0.5') checkPicture(s); else checkOpen(s);
    }).catch(function (e) { lens.busy = false; stream = null; paintLens(); lensFail(e); });
  }
  /** Call once the live camera is showing: learn the lenses and open the one used last time. */
  function afterOpen() {
    findLenses().then(function () {
      if (!stream) return;
      if (camTier >= 2) { lens.cur = '1'; paintLens(); return; }
      var want = savedLens();
      if (want === '0.5' && !lens.ultraId) want = '1';
      var need = want === '0.5' ? lens.ultraId : lens.mainId;
      if (need && need !== trackId()) setLens(want, true); else { lens.cur = want; paintLens(); }
    });
  }
  (function () {
    var bar = $('lensBar');
    if (bar) bar.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (b) setLens(b.getAttribute('data-z'));
    });
  })();


  /** After switching to .5x: if the picture is black or not moving after 2 s, go back to 1x and hide .5x
      for the rest of this visit (some iPhones give the page a black ultra-wide feed). */
  function checkPicture(s) {
    var v = $('camVideo'), t0 = v.currentTime;
    setTimeout(function () {
      if (stream !== s || !camShowing() || lens.cur !== '0.5' || lens.busy) return;
      if (v.videoWidth && v.currentTime !== t0 && !isBlack(v)) return;
      lens.ultraBad = true; lens.ultraId = '';
      toast('The .5x lens isn’t working on this phone — back to 1x.', 3500);
      setLens('1', true);
    }, 2000);
  }
  function isBlack(v) {
    try {
      var c = document.createElement('canvas'); c.width = 32; c.height = 24;
      var g = c.getContext('2d'); g.drawImage(v, 0, 0, 32, 24);
      var d = g.getImageData(0, 0, 32, 24).data, max = 0, sum = 0;
      for (var i = 0; i < d.length; i += 4) { var y = (d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10; sum += y; if (y > max) max = y; }
      return max < 24 && sum / (d.length / 4) < 8;
    } catch (e) { return false; }
  }


  /** ~2.5 s after the camera opens: if the picture is black, frozen or has no size, step down a tier
      and reopen; past tier 2, close the live camera and use the phone's own camera. */
  function checkOpen(s) {
    var v = $('camVideo'), t0 = -1;
    setTimeout(function () { if (stream === s) t0 = v.currentTime; }, 800);
    setTimeout(function () {
      if (!camShowing() || lens.busy || cam.restarting || document.hidden) return;
      if (stream && stream !== s) return;                       // lens switch/restart took over
      var ok = stream === s && v.videoWidth && v.currentTime !== t0 && !isBlack(v);
      if (ok) { saveTier(); renderStatus(); return; }
      camTier++; saveTier();
      if (camTier >= 3) {
        closeCamera(); camMode = 'phone camera'; camError = 'live picture black'; renderStatus();
        toast('The live camera shows black on this phone. Tap Take photos again to use your phone’s camera.', 5000);
        return;
      }
      lens.cur = '1'; releaseStream();
      navigator.mediaDevices.getUserMedia(camConstraints(lens.mainId || null)).then(function (s2) {
        if (!camShowing() || document.hidden) { s2.getTracks().forEach(function (t) { t.stop(); }); return; }
        useStream(s2); paintLens(); renderStatus(); checkOpen(s2);
      }).catch(function (e) { closeCamera(); fallback((e && e.name) || 'reopen failed'); });
    }, 2500);
  }

  function lensFail(e) { closeCamera(); fallback((e && e.name) || 'lens switch failed'); }


  // ---------- camera health ----------
  // iPhones cut a web page's camera when the page is hidden: screen lock, switching apps, a call, a
  // notification opened, or another tab/app taking the camera. The track then ends or goes "muted" and
  // the camera screen would sit on a black picture. So: let go of the camera while hidden, start it again
  // on return, restart it if it dies while showing, and after 2 failed restarts fall back to the
  // phone's own camera instead of leaving a black screen.
  var cam = { watch: null, restarts: 0, restarting: false, lastT: -1, seenMotion: false, stall: 0, healthy: 0 };
  function trackLive() {
    var t = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
    return !!(t && t.readyState === 'live' && !t.muted);
  }
  function useStream(s) {
    stream = s; cam.lastT = -1; cam.seenMotion = false; cam.stall = 0;
    var v = $('camVideo'); v.srcObject = s; var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
    s.getVideoTracks().forEach(function (t) {
      t.addEventListener('ended', function () { if (stream === s && !lens.busy) restartCamera('ended'); });
    });
  }
  function startWatch() {
    stopWatch();
    cam.watch = setInterval(function () {
      if (!camShowing() || lens.busy || cam.restarting || document.hidden || !stream) return;
      var v = $('camVideo'), t = v.currentTime;
      var moving = v.readyState >= 2 && cam.lastT >= 0 && t !== cam.lastT;
      cam.lastT = t;
      if (moving) cam.seenMotion = true;
      // Frozen only counts once we've seen this browser's picture move (so a browser that never
      // advances currentTime can't trigger restarts); a muted/ended track always counts.
      var bad = !trackLive() || (cam.seenMotion && !moving);
      if (!bad) { cam.stall = 0; if (moving && ++cam.healthy >= 2) cam.restarts = 0; return; }
      cam.healthy = 0;
      if (++cam.stall >= 3) restartCamera(trackLive() ? 'frozen' : 'muted');
    }, 1000);
  }
  function stopWatch() { if (cam.watch) clearInterval(cam.watch); cam.watch = null; cam.stall = 0; cam.healthy = 0; }
  function releaseStream() { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } }
  function restartCamera(why, quiet) {
    if (!camShowing() || cam.restarting || document.hidden) return;
    if (cam.restarts >= 2) { closeCamera(); fallback('camera stopped: ' + why); return; }
    cam.restarts++; cam.restarting = true; cam.stall = 0; cam.healthy = 0;
    if (!quiet) toast('Restarting camera…', 1500);
    if (lens.cur === '0.5') lens.cur = '1';   // restart on the main lens, the safe one
    releaseStream();
    navigator.mediaDevices.getUserMedia(camConstraints(startId())).then(function (s) {
      cam.restarting = false;
      if (!camShowing() || document.hidden) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      useStream(s); paintLens(); checkOpen(s);
    }).catch(function (e) { cam.restarting = false; closeCamera(); fallback((e && e.name) || 'restart failed'); });
  }
  function camHidden() { if (camShowing()) { releaseStream(); cam.restarting = false; } }
  function camShown() { if (camShowing() && !stream) { cam.restarts = 0; restartCamera('resume', true); } }
  document.addEventListener('visibilitychange', function () { if (document.hidden) camHidden(); else camShown(); });
  window.addEventListener('pagehide', camHidden);
  window.addEventListener('pageshow', function () { if (!document.hidden) camShown(); });

  // ---------- live camera (one tap per photo) ----------
  function openCamera() {
    if (camMode === 'phone camera' || camTier >= 3) { camMode = 'phone camera'; renderStatus(); return $('fileCam').click(); }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fallback('not supported here'); return; }
    navigator.mediaDevices.getUserMedia(camConstraints(startId()))
      .then(function (s) {
        camMode = 'live'; camError = ''; cam.restarts = 0; lens.cur = '1';
        $('cam').classList.add('show'); useStream(s); startWatch();
        renderStatus(); updateLast(); afterOpen(); checkOpen(s);
      })
      .catch(function (e) { fallback((e && e.name) || 'blocked'); });
  }
  function fallback(why) {
    camMode = 'phone camera'; camError = why; renderStatus();
    // Browsers only open the camera from a direct tap, so ask for one more tap.
    toast('Live camera isn’t available here. Tap Take photos again to use your phone’s camera.', 4500);
  }
  function closeCamera() {
    stopWatch(); cam.restarting = false;
    $('cam').classList.remove('show');
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    renderStatus();
  }
  function shoot() {
    var v = $('camVideo');
    if (!trackLive()) { restartCamera('dead at shutter'); return; }   // never save a black frame
    if (!v.videoWidth) return;
    var f = $('flash'); f.style.opacity = '0.8'; setTimeout(function () { f.style.opacity = '0'; }, 90);
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
    var out = encode(v, v.videoWidth, v.videoHeight, lens.cur === '2' ? 2 : 1);
    addPhoto(out.data, out.thumb, new Date().toISOString());
    updateLast();
  }
  function updateLast() {
    var live = state.photos.filter(function (p) { return !p.removed; });
    var last = live[live.length - 1], el = $('camLast');
    el.style.backgroundImage = last && last.thumb ? 'url(' + last.thumb + ')' : 'none';
    el.textContent = live.length ? live.length : '';
    renderStatus();
  }
  $('shutter').addEventListener('click', shoot);
  $('camDone').addEventListener('click', closeCamera);

  // ---------- phone camera / library ----------
  function readFiles(files) {
    Array.prototype.forEach.call(files || [], function (file) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var out = encode(img, img.naturalWidth, img.naturalHeight);
        URL.revokeObjectURL(url);
        addPhoto(out.data, out.thumb, new Date(file.lastModified || Date.now()).toISOString());
      };
      img.onerror = function () { URL.revokeObjectURL(url); toast('That photo could not be read.'); };
      img.src = url;
    });
  }
  $('fileCam').addEventListener('change', function (e) { readFiles(e.target.files); e.target.value = ''; });
  $('fileLib').addEventListener('change', function (e) { readFiles(e.target.files); e.target.value = ''; });
  // ===== end of copied camera =====

  // ---------- who ----------
  function readWho() { try { return JSON.parse(localStorage.getItem(WHO_KEY) || 'null'); } catch (e) { return null; } }
  function pickWho(force, then) {
    var team = M.team || [], saved = readWho();
    if (!force && saved && team.some(function (x) { return x.email === saved.email; })) { WHO = saved; return then(); }
    $('app').innerHTML = '<div class="done-screen" style="padding-top:40px"><h1 style="font-size:21px;margin:0 0 6px">Who’s adding these?</h1>' +
      '<p style="color:#5f6368;margin:0 0 14px">' + esc(M.job) + '<br>This phone will remember your answer.</p>' +
      team.map(function (x, i) { return '<button class="btn alt who" data-i="' + i + '" style="margin-top:10px;font-size:17px;padding:15px">' + esc(x.name) + '</button>'; }).join('') + '</div>';
    Array.prototype.forEach.call(document.querySelectorAll('button.who'), function (b) {
      b.addEventListener('click', function () {
        WHO = team[+b.getAttribute('data-i')];
        try { localStorage.setItem(WHO_KEY, JSON.stringify(WHO)); } catch (e) {}
        then();
      });
    });
  }

  // ---------- start ----------
  function start() {
    document.title = M.job + ' — ' + (MODE === 'photos' ? 'Add photos' : 'Add documents');
    render();
    // Straight into the camera when this phone already allowed it (saves a tap). Otherwise the
    // person taps Take photos — browsers only show the permission prompt from a tap.
    if (MODE === 'photos' && navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'camera' }).then(function (p) {
        if (p.state === 'granted' && camTier < 3 && !$('cam').classList.contains('show')) openCamera();
      }).catch(function () {});
    }
  }
  var q = new URLSearchParams(location.search);
  LINK = { j: q.get('j') || '', s: q.get('s') || '' };
  MODE = q.get('m') === 'docs' ? 'docs' : 'photos';
  var dep = q.get('a') || '';
  if (!/^rec[A-Za-z0-9]{14}$/.test(LINK.j) || !/^[A-Za-z0-9_-]{20,64}$/.test(LINK.s) || !/^[A-Za-z0-9_-]{20,120}$/.test(dep)) {
    return renderMessage('Link is incomplete', 'Go back to Airtable and tap Add photos again.');
  }
  API = 'https://script.google.com/macros/s/' + dep + '/exec';
  newSession();
  renderMessage('Loading…', '');
  post('load', {}).then(function (m) { M = m; pickWho(false, start); })
    .catch(function (e) {
      if (e && (e.code === 'bad-link' || e.code === 'not-found')) return renderMessage('Job not found', 'Go back to Airtable and tap the button again.');
      renderMessage('No connection', 'Could not load the job. Check your signal and reload this page.');
    });
})();
</script>
</body>
</html>
