<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Captiva checklist</title>
<style>
  :root { --blue:#1a73e8; --ink:#202124; --mute:#5f6368; --line:#e3e5e8; --bg:#f4f5f7; --ok:#188038; --warn:#b06000; --bad:#c5221f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px 10px; }
  header h1 { font-size:18px; margin:0 0 2px; line-height:1.25; }
  header .sub { color:var(--mute); font-size:14px; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--blue); transition:width .2s; }
  .progress { font-size:13px; color:var(--mute); margin-top:4px; }
  main { padding:12px 12px 120px; max-width:680px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; margin:0 0 12px; overflow:hidden; }
  .card h2 { font-size:15px; margin:0; padding:12px 14px; background:#fafbfc; border-bottom:1px solid var(--line); }
  .card h2 small { font-weight:400; color:var(--mute); }
  .row { display:flex; align-items:flex-start; gap:12px; padding:13px 14px; border-top:1px solid var(--line); cursor:pointer; user-select:none; }
  .row:first-of-type { border-top:0; }
  .box { flex:0 0 28px; height:28px; border:2px solid #9aa0a6; border-radius:7px; display:flex; align-items:center; justify-content:center; margin-top:-2px; }
  .row.on .box { background:var(--blue); border-color:var(--blue); }
  .row.on .box::after { content:""; width:8px; height:14px; border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg) translate(-1px,-1px); }
  .row.on .txt { color:var(--mute); }
  .pad { padding:12px 14px; }
  .hint { color:var(--mute); font-size:14px; white-space:pre-line; margin:0 0 10px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:10px; padding:15px; font-size:17px; font-weight:600; background:var(--blue); color:#fff; }
  .btn.alt { background:#e8f0fe; color:var(--blue); margin-top:8px; font-weight:500; font-size:15px; padding:12px; }
  .btn:disabled { background:#c4c7cc; color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; margin-top:12px; }
  .th { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:#dfe1e5; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--mute); }
  .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .th .st { position:absolute; left:4px; bottom:4px; font-size:11px; padding:2px 6px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; }
  .th .st.bad { background:var(--bad); }
  .th .x { position:absolute; right:3px; top:3px; width:26px; height:26px; border-radius:13px; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:16px; line-height:26px; padding:0; }
  textarea { width:100%; min-height:70px; border:1px solid #c4c7cc; border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  label.q { display:block; font-weight:600; font-size:15px; margin:10px 0 6px; }
  label.q:first-child { margin-top:0; }
  footer { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  footer .inner { max-width:680px; margin:0 auto; }
  footer .note { font-size:13px; color:var(--mute); text-align:center; margin-bottom:6px; min-height:16px; }
  .diag { font-size:11px; color:#9aa0a6; text-align:center; margin:18px 0 0; word-break:break-word; }
  /* camera overlay */
  #cam { position:fixed; inset:0; z-index:20; background:#000; display:none; flex-direction:column; overflow:hidden; }
  #cam.show { display:flex; }
  #cam video { flex:1; width:100%; height:100%; object-fit:cover; background:#000; }
  #cam .top { position:absolute; top:0; left:0; right:0; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; color:#fff; font-size:16px; font-weight:600; text-align:center; background:linear-gradient(rgba(0,0,0,.55),transparent); }
  #cam .bot { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between; padding:18px 22px calc(22px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,rgba(0,0,0,.6)); }
  #shutter { width:78px; height:78px; border-radius:50%; border:5px solid #fff; background:rgba(255,255,255,.25); padding:0; }
  #shutter:active { background:#fff; }
  #camLast { width:56px; height:56px; border-radius:8px; border:2px solid #fff; background:#333 center/cover no-repeat; color:#fff; font-weight:700; display:flex; align-items:flex-end; justify-content:flex-end; padding:2px 4px; font-size:14px; }
  #camDone { min-width:72px; height:48px; border-radius:24px; border:0; background:#fff; color:#000; font-weight:700; font-size:16px; padding:0 16px; }
  #lensBar { position:absolute; left:0; right:0; bottom:calc(126px + env(safe-area-inset-bottom)); display:none; justify-content:center; align-items:center; gap:12px; pointer-events:none; }
  #lensBar button { pointer-events:auto; width:44px; height:44px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:13px; font-weight:700; padding:0; }
  #lensBar button.on { width:52px; height:52px; color:#ffd60a; font-size:16px; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .15s; }
  .done-screen { text-align:center; padding:56px 20px; }
  .done-screen .tick { width:72px; height:72px; border-radius:50%; background:var(--ok); margin:0 auto 16px; position:relative; }
  .done-screen .tick::after { content:""; position:absolute; left:26px; top:14px; width:16px; height:32px; border:solid #fff; border-width:0 6px 6px 0; transform:rotate(45deg); }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:96px; background:#323232; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; z-index:30; display:none; max-width:90%; text-align:center; }
</style>
</head>
<body>
<div id="app"></div>
<div id="cam">
  <video id="camVideo" playsinline autoplay muted></video>
  <div id="flash"></div>
  <div class="top" id="camTitle">Photo 1</div>
  <div id="lensBar"></div>
  <div class="bot">
    <div id="camLast"></div>
    <button id="shutter" aria-label="Take photo"></button>
    <button id="camDone">Done</button>
  </div>
</div>
<input id="fileCam" type="file" accept="image/*" capture="environment" style="display:none">
<input id="fileLib" type="file" accept="image/*" multiple style="display:none">
<div class="toast" id="toast"></div>

<!-- Filled in by Apps Script (mode A). On GitHub Pages (mode B) it stays as-is and the page loads via the API. -->
<script type="application/json" id="model"><?!= data ?></script>
<script>
var M = null;
(function () {
  'use strict';
  var MAX_SIDE = 2048, QUALITY = 0.85, PARALLEL = 2, DRAFT_DELAY = 1200;
  var KEY = '';
  var LINK = null, API = '';   // GitHub modes: link code + API address from the URL
  var WHO = null;              // direct links: the person filling it out ({name, email})
  var WHO_KEY = 'captiva-who';
  var state = { checked: {}, answers: {}, notes: '', photos: [], submitting: false, submitted: null };
  var camMode = 'unknown', camError = '', stream = null;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function rid() { var a = new Uint8Array(12); (window.crypto || window.msCrypto).getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(36)).slice(-2); }).join(''); }
  function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, ms || 2500); }

  // ---------- server calls ----------
  // Mode A (inside Apps Script): google.script.run.  Mode B (GitHub Pages): POST to the API deployment
  // with the signed link; the server only acts on the checklist the link was signed for.
  function gsr(fn, args) {
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e && e.message ? e : new Error(String(e))); });
      r[fn].apply(r, args);
    });
  }
  function post(fn, args) {
    args = args || {};
    if (WHO) args.who = WHO.email;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, k: LINK, args: args || {} }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.error || 'failed'); e.code = j.error; throw e; } return j.result; });
  }
  var srv = {
    upload: function (p) { return LINK ? post('upload', { clientId: p.clientId, b64: p.data, takenAt: p.takenAt, thumb: p.thumb }) : gsr('clUpload', [M.taskId, p.clientId, p.data, p.takenAt, p.thumb]); },
    del: function (id) { return LINK ? post('delete', { fileId: id }) : gsr('clDeletePhoto', [M.taskId, id]); },
    draft: function (d) { return LINK ? post('draft', { draft: d }) : gsr('clSaveDraft', [M.taskId, d]); },
    submit: function (p) { return LINK ? post('submit', { p: p }) : gsr('clSubmit', [p]); }
  };

  // ---------- draft: on this phone AND on the server (so it can be finished tomorrow, on any phone) ----------
  var draftTimer = null, draftBusy = false, draftDirty = false, draftState = '';
  function applyDraft(d) {
    state.checked = {};
    (d.checked || []).forEach(function (c) { state.checked[itemKey(c.s, c.t)] = true; });
    state.answers = d.answers || {}; state.notes = d.notes || '';
  }
  function draftObj() {
    var checked = [];
    M.sections.forEach(function (s) { s.items.forEach(function (t) { if (state.checked[itemKey(s.title, t)]) checked.push({ s: s.title, t: t }); }); });
    return { checked: checked, answers: state.answers, notes: state.notes };
  }
  function loadDraft() {
    var local = null, server = M.draft || null;
    try { local = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    var pick = !local ? server : !server ? local : (String(local.savedAt || '') > String(server.savedAt || '') ? local : server);
    if (pick) applyDraft(pick);
    return !!(pick && ((pick.checked || []).length || pick.notes || Object.keys(pick.answers || {}).some(function (k) { return pick.answers[k]; })));
  }
  function saveDraft() {
    var d = draftObj(); d.savedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
    draftDirty = true; draftState = 'saving'; renderSaved();
    clearTimeout(draftTimer); draftTimer = setTimeout(pushDraft, DRAFT_DELAY);
  }
  function pushDraft() {
    if (draftBusy || !draftDirty || state.submitted) return;
    draftBusy = true; draftDirty = false;
    srv.draft(draftObj()).then(function () { draftState = draftDirty ? 'saving' : 'saved'; })
      .catch(function () { draftDirty = true; draftState = 'offline'; clearTimeout(draftTimer); draftTimer = setTimeout(pushDraft, 8000); })
      .then(function () { draftBusy = false; if (draftDirty) { clearTimeout(draftTimer); draftTimer = setTimeout(pushDraft, DRAFT_DELAY); } renderSaved(); });
  }
  function renderSaved() {
    var el = $('saved'); if (!el) return;
    el.textContent = draftState === 'saved' ? 'Progress saved \u2014 you can finish later' : draftState === 'saving' ? 'Saving\u2026' : draftState === 'offline' ? 'Saved on this phone \u2014 will sync when you have signal' : '';
  }
  function clearDraft() { try { localStorage.removeItem(KEY); } catch (e) {} clearTimeout(draftTimer); }

  // ---------- counts ----------
  function itemKey(s, t) { return s + '\u0001' + t; }
  function counts() {
    var total = 0, done = 0;
    M.sections.forEach(function (s) { s.items.forEach(function (t) { total++; if (state.checked[itemKey(s.title, t)]) done++; }); });
    var live = state.photos.filter(function (p) { return !p.removed; });
    var saved = live.filter(function (p) { return p.status === 'saved'; }).length;
    var pending = live.filter(function (p) { return p.status === 'uploading' || p.status === 'queued'; }).length;
    var failed = live.filter(function (p) { return p.status === 'failed'; }).length;
    return { total: total, done: done, photos: live.length, saved: saved, pending: pending, failed: failed };
  }

  // ---------- render ----------
  function render() {
    if (state.submitted) return renderDone();
    var h = [];
    var canChange = WHO && (M.people || []).length !== 1;
    h.push('<header><h1>' + esc(M.title) + '</h1><div class="sub">' + esc(M.job) + (M.community ? ' &middot; ' + esc(M.community) : '') +
      (M.due ? ' &middot; Due ' + esc(fmtDate(M.due)) : '') +
      (WHO ? ' &middot; ' + esc(WHO.name.split(' ')[0]) + (canChange ? ' <a href="#" id="changeWho" style="color:#1a73e8">change</a>' : '') : '') + '</div><div class="bar"><i id="barFill"></i></div><div class="progress" id="prog"></div></header><main>');
    M.sections.forEach(function (s, si) {
      h.push('<div class="card"><h2>' + esc(s.title) + (s.community ? ' <small>&middot; ' + esc(s.community) + ' only</small>' : '') + '</h2>');
      s.items.forEach(function (t, ti) {
        var on = !!state.checked[itemKey(s.title, t)];
        h.push('<div class="row' + (on ? ' on' : '') + '" data-s="' + si + '" data-t="' + ti + '"><div class="box"></div><div class="txt">' + esc(t) + '</div></div>');
      });
      h.push('</div>');
    });
    h.push('<div class="card"><h2>Photos <small>&middot; ' + (M.photosRequired ? M.photosRequired + ' required' : 'optional') + '</small></h2><div class="pad">');
    if (M.photoPrompts) h.push('<p class="hint">' + esc(M.photoPrompts) + '</p>');
    h.push('<button class="btn" id="takeBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>Take photos</button>');
    h.push('<button class="btn alt" id="libBtn">Add from phone&rsquo;s photos</button>');
    h.push('<div class="grid" id="grid"></div></div></div>');
    if (M.questions.length) {
      h.push('<div class="card"><h2>Answers</h2><div class="pad">');
      M.questions.forEach(function (q, qi) { h.push('<label class="q" for="q' + qi + '">' + esc(q) + '</label><textarea id="q' + qi + '" data-q="' + qi + '">' + esc(state.answers[q] || '') + '</textarea>'); });
      h.push('</div></div>');
    }
    h.push('<div class="card"><h2>Notes <small>&middot; optional</small></h2><div class="pad"><textarea id="notes">' + esc(state.notes) + '</textarea></div></div>');
    h.push('<p class="diag" id="diag"></p></main>');
    h.push('<footer><div class="inner"><div class="note" id="footNote"></div><div class="note" id="saved" style="min-height:0"></div><button class="btn" id="submitBtn">Submit checklist</button></div></footer>');
    $('app').innerHTML = h.join('');
    Array.prototype.forEach.call(document.querySelectorAll('.row'), function (el) { el.addEventListener('click', onRow); });
    Array.prototype.forEach.call(document.querySelectorAll('textarea[data-q]'), function (el) { el.addEventListener('input', function () { state.answers[M.questions[+el.getAttribute('data-q')]] = el.value; saveDraft(); }); });
    $('notes').addEventListener('input', function () { state.notes = $('notes').value; saveDraft(); });
    $('takeBtn').addEventListener('click', openCamera);
    $('libBtn').addEventListener('click', function () { $('fileLib').click(); });
    $('submitBtn').addEventListener('click', submit);
    if ($('changeWho')) $('changeWho').addEventListener('click', function (e) { e.preventDefault(); pickWho(true, render); });
    renderPhotos(); renderStatus(); renderSaved();
  }
  function fmtDate(iso) { var p = String(iso).split('-'); return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : iso; }
  function onRow(e) {
    var el = e.currentTarget, s = M.sections[+el.getAttribute('data-s')], t = s.items[+el.getAttribute('data-t')], k = itemKey(s.title, t);
    if (state.checked[k]) delete state.checked[k]; else state.checked[k] = true;
    el.classList.toggle('on', !!state.checked[k]);
    saveDraft(); renderStatus();
  }
  function renderPhotos() {
    var g = $('grid'); if (!g) return;
    g.innerHTML = state.photos.map(function (p, i) {
      if (p.removed) return '';
      var st = p.status === 'saved' ? 'Saved' : p.status === 'failed' ? 'Tap to retry' : 'Uploading…';
      var img = p.thumb ? '<img src="' + p.thumb + '" alt="">' : 'Photo ' + (i + 1);
      return '<div class="th" data-i="' + i + '">' + img + '<span class="st' + (p.status === 'failed' ? ' bad' : '') + '">' + st + '</span><button class="x" data-x="' + i + '" aria-label="Remove">&times;</button></div>';
    }).join('');
    Array.prototype.forEach.call(g.querySelectorAll('.x'), function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); removePhoto(+b.getAttribute('data-x')); }); });
    Array.prototype.forEach.call(g.querySelectorAll('.th'), function (el) { el.addEventListener('click', function () { var p = state.photos[+el.getAttribute('data-i')]; if (p && p.status === 'failed') { p.status = 'queued'; p.tries = 0; pump(); renderPhotos(); renderStatus(); } }); });
  }
  function renderStatus() {
    var c = counts();
    var pct = c.total ? Math.round(100 * c.done / c.total) : 100;
    if ($('barFill')) $('barFill').style.width = pct + '%';
    var ph = M.photosRequired && c.photos < M.photosRequired ? c.photos + ' of ' + M.photosRequired + ' photos' : c.photos + ' photo' + (c.photos === 1 ? '' : 's') + (M.photosRequired ? ' ✓' : '');
    if ($('prog')) $('prog').textContent = c.done + ' of ' + c.total + ' items · ' + ph;
    var note = '';
    if (c.pending) note = 'Uploading ' + c.pending + ' photo' + (c.pending === 1 ? '' : 's') + '… keep this page open';
    else if (c.failed) note = c.failed + ' photo' + (c.failed === 1 ? '' : 's') + ' did not upload — tap it to retry';
    if ($('footNote')) $('footNote').textContent = note;
    if ($('submitBtn')) { $('submitBtn').disabled = state.submitting || c.pending > 0 || c.failed > 0; $('submitBtn').textContent = state.submitting ? 'Submitting…' : 'Submit checklist'; }
    if ($('diag')) $('diag').textContent = 'Camera: ' + camMode + (camError ? ' (' + camError + ')' : '') + (camMode === 'live' ? ' · lens ' + lens.cur + 'x' + (lens.ultraId ? '' : ' (no ultra wide found)') : '') + ' · ' + (M.code || '') + ' · ' + M.taskId;
    if ($('camTitle')) $('camTitle').textContent = ph;
  }
  function renderDone() {
    var r = state.submitted;
    $('app').innerHTML = '<div class="done-screen"><div class="tick"></div><h1 style="font-size:22px;margin:0 0 8px">Checklist submitted</h1>' +
      '<p style="color:#5f6368;margin:0 0 6px">' + esc(M.job) + ' · ' + esc(M.title) + '</p>' +
      '<p style="color:#5f6368">' + r.done + ' of ' + r.total + ' items · ' + r.photos + ' photo' + (r.photos === 1 ? '' : 's') + '</p>' +
      (r.message ? '<p style="color:#5f6368">' + esc(r.message) + '</p>' : '') +
      '<p style="color:#5f6368;margin-top:22px">You can close this page.</p></div>';
  }

  // ---------- photos ----------
  function addPhoto(dataUrl, thumb, takenAt) {
    var p = { clientId: rid(), data: dataUrl, thumb: thumb, takenAt: takenAt, status: 'queued', tries: 0, id: null };
    state.photos.push(p); pump(); renderPhotos(); renderStatus();
  }
  function pump() {
    var busy = state.photos.filter(function (p) { return p.status === 'uploading'; }).length;
    state.photos.forEach(function (p) {
      if (busy >= PARALLEL || p.status !== 'queued' || p.removed) return;
      busy++; p.status = 'uploading'; p.tries++;
      srv.upload(p).then(function (r) {
        p.id = r.id; p.status = 'saved'; p.data = null;
        if (p.removed) srv.del(p.id).catch(function () {});
      }).catch(function () {
        p.status = p.tries < 3 ? 'queued' : 'failed';
        if (p.status === 'queued') return new Promise(function (ok) { setTimeout(ok, 1500 * p.tries); });
      }).then(function () { pump(); renderPhotos(); renderStatus(); });
    });
  }
  function removePhoto(i) {
    var p = state.photos[i]; if (!p) return;
    if (!confirm('Remove this photo?')) return;
    p.removed = true;
    if (p.id) srv.del(p.id).catch(function () {});
    renderPhotos(); renderStatus();
  }
  /** Draw a video frame or image into a JPEG no larger than MAX_SIDE; returns {data, thumb}. */
  function encode(src, w, h, zoom) {
    zoom = zoom || 1;   // 2 = centre crop (the 2x lens button)
    var sw = w / zoom, sh = h / zoom;
    var s = Math.min(1, MAX_SIDE / Math.max(sw, sh));
    var c = document.createElement('canvas'); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
    c.getContext('2d').drawImage(src, (w - sw) / 2, (h - sh) / 2, sw, sh, 0, 0, c.width, c.height);
    var data = c.toDataURL('image/jpeg', QUALITY);
    var ts = 180 / Math.max(c.width, c.height), t = document.createElement('canvas');
    t.width = Math.round(c.width * ts); t.height = Math.round(c.height * ts);
    t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
    return { data: data, thumb: t.toDataURL('image/jpeg', 0.7) };
  }

  // ---------- lens picker (.5x ultra wide / 1x / 2x) ----------
  // iPhones list each back lens as its own camera once the camera is allowed.
  // .5x = the Ultra Wide lens; 1x = the main lens; 2x = centre crop of the main lens.
  var LENS_KEY = 'captiva-lens';
  var lens = { cur: '1', mainId: '', ultraId: '', busy: false, labels: '' };
  function savedLens() { try { return localStorage.getItem(LENS_KEY) || '1'; } catch (e) { return '1'; } }
  function saveLens(z) { try { localStorage.setItem(LENS_KEY, z); } catch (e) {} }
  function camConstraints(id) {
    var v = { width: { ideal: 4096 }, height: { ideal: 3072 } };
    if (id) v.deviceId = { exact: id }; else v.facingMode = { ideal: 'environment' };
    return { audio: false, video: v };
  }
  function startId() {
    var want = savedLens();
    return (want === '0.5' && lens.ultraId) ? lens.ultraId : (lens.mainId || null);
  }
  function trackId() {
    var t = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
    return t && t.getSettings ? (t.getSettings().deviceId || '') : '';
  }
  function camShowing() { return $('cam').classList.contains('show'); }
  function findLenses() {
    if (!navigator.mediaDevices.enumerateDevices) { if (!lens.mainId) lens.mainId = trackId(); return Promise.resolve(); }
    return navigator.mediaDevices.enumerateDevices().then(function (ds) {
      var main = '', ultra = '', names = [];
      ds.forEach(function (d) {
        var l = d.label || '';
        if (d.kind !== 'videoinput') return;
        names.push(l || '?');
        if (!l || /front|frontal|delantera|facetime/i.test(l)) return;
        if (/ultra/i.test(l)) { if (!ultra) ultra = d.deviceId; return; }
        if (/tele|dual|doble|dupla|triple|tripla|triplo/i.test(l)) return;
        if (!main) main = d.deviceId;
      });
      lens.ultraId = ultra;
      lens.mainId = main || lens.mainId || trackId();
      lens.labels = names.join(', ');
    }).catch(function () { if (!lens.mainId) lens.mainId = trackId(); });
  }
  function paintLens() {
    var bar = $('lensBar'), v = $('camVideo');
    v.style.transform = lens.cur === '2' ? 'scale(2)' : '';
    if (!bar) return;
    var opts = lens.ultraId ? ['0.5', '1', '2'] : ['1', '2'];
    bar.innerHTML = opts.map(function (z) {
      var on = z === lens.cur, txt = (z === '0.5' ? '.5' : z) + (on ? '×' : '');
      return '<button type="button" data-z="' + z + '"' + (on ? ' class="on"' : '') + ' aria-label="' + z + 'x lens">' + txt + '</button>';
    }).join('');
    bar.style.display = stream ? 'flex' : 'none';
  }
  function setLens(z, force) {
    if (lens.busy || !stream) return;
    if (z === lens.cur && !force) return;
    if (z === '0.5' && !lens.ultraId) z = '1';
    var id = z === '0.5' ? lens.ultraId : lens.mainId;
    saveLens(z);
    if (!id || id === trackId()) { lens.cur = z; paintLens(); return; }
    lens.busy = true;
    var v = $('camVideo');
    stream.getTracks().forEach(function (t) { t.stop(); });   // iPhone runs one camera at a time
    navigator.mediaDevices.getUserMedia(camConstraints(id)).then(null, function () {
      z = '1'; return navigator.mediaDevices.getUserMedia(camConstraints(lens.mainId || null));
    }).then(function (s) {
      lens.busy = false;
      if (!camShowing()) { s.getTracks().forEach(function (t) { t.stop(); }); stream = null; return; }
      stream = s; v.srcObject = s; var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
      lens.cur = z; paintLens();
    }).catch(function (e) { lens.busy = false; stream = null; paintLens(); lensFail(e); });
  }
  /** Call once the live camera is showing: learn the lenses and open the one used last time. */
  function afterOpen() {
    findLenses().then(function () {
      if (!stream) return;
      var want = savedLens();
      if (want === '0.5' && !lens.ultraId) want = '1';
      var need = want === '0.5' ? lens.ultraId : lens.mainId;
      if (need && need !== trackId()) setLens(want, true); else { lens.cur = want; paintLens(); }
    });
  }
  (function () {
    var bar = $('lensBar');
    if (bar) bar.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (b) setLens(b.getAttribute('data-z'));
    });
  })();

  function lensFail(e) { closeCamera(); fallback((e && e.name) || 'lens switch failed'); }

  // ---------- live camera (one tap per photo) ----------
  function openCamera() {
    if (camMode === 'phone camera') return $('fileCam').click();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fallback('not supported here'); return; }
    navigator.mediaDevices.getUserMedia(camConstraints(startId()))
      .then(function (s) {
        stream = s; camMode = 'live'; camError = '';
        var v = $('camVideo'); v.srcObject = s; var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
        $('cam').classList.add('show'); renderStatus(); updateLast(); afterOpen();
      })
      .catch(function (e) { fallback((e && e.name) || 'blocked'); });
  }
  function fallback(why) {
    camMode = 'phone camera'; camError = why; renderStatus();
    // Browsers only open the camera from a direct tap, so ask for one more tap.
    toast('Live camera isn’t available here. Tap Take photos again to use your phone’s camera.', 4500);
  }
  function closeCamera() {
    $('cam').classList.remove('show');
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    renderStatus();
  }
  function shoot() {
    var v = $('camVideo');
    if (!v.videoWidth) return;
    var f = $('flash'); f.style.opacity = '0.8'; setTimeout(function () { f.style.opacity = '0'; }, 90);
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
    var out = encode(v, v.videoWidth, v.videoHeight, lens.cur === '2' ? 2 : 1);
    addPhoto(out.data, out.thumb, new Date().toISOString());
    updateLast();
  }
  function updateLast() {
    var live = state.photos.filter(function (p) { return !p.removed; });
    var last = live[live.length - 1], el = $('camLast');
    el.style.backgroundImage = last && last.thumb ? 'url(' + last.thumb + ')' : 'none';
    el.textContent = live.length ? live.length : '';
    renderStatus();
  }
  $('shutter').addEventListener('click', shoot);
  $('camDone').addEventListener('click', closeCamera);

  // ---------- phone camera / library ----------
  function readFiles(files) {
    Array.prototype.forEach.call(files || [], function (file) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var out = encode(img, img.naturalWidth, img.naturalHeight);
        URL.revokeObjectURL(url);
        addPhoto(out.data, out.thumb, new Date(file.lastModified || Date.now()).toISOString());
      };
      img.onerror = function () { URL.revokeObjectURL(url); toast('That photo could not be read.'); };
      img.src = url;
    });
  }
  $('fileCam').addEventListener('change', function (e) { readFiles(e.target.files); e.target.value = ''; });
  $('fileLib').addEventListener('change', function (e) { readFiles(e.target.files); e.target.value = ''; });

  // ---------- submit ----------
  function submit() {
    var c = counts();
    var gaps = [];
    if (c.done < c.total) gaps.push((c.total - c.done) + ' item' + (c.total - c.done === 1 ? '' : 's') + ' not checked');
    if (M.photosRequired && c.saved < M.photosRequired) gaps.push((M.photosRequired - c.saved) + ' photo' + (M.photosRequired - c.saved === 1 ? '' : 's') + ' short');
    if (gaps.length && !confirm(gaps.join(' and ') + '. Submit anyway?')) return;
    var checked = [];
    M.sections.forEach(function (s) { s.items.forEach(function (t) { if (state.checked[itemKey(s.title, t)]) checked.push({ s: s.title, t: t }); }); });
    var payload = {
      taskId: M.taskId, submissionId: state.submissionId || (state.submissionId = rid()),
      checked: checked,
      answers: M.questions.map(function (q) { return { q: q, a: state.answers[q] || '' }; }),
      notes: state.notes,
      photos: state.photos.filter(function (p) { return !p.removed && p.status === 'saved'; }).map(function (p) { return { id: p.id, takenAt: p.takenAt }; })
    };
    state.submitting = true; renderStatus();
    clearTimeout(draftTimer);
    srv.submit(payload).then(function (r) {
      state.submitting = false;
      if (!r || !r.ok) { toast((r && r.message) || 'Could not submit. Try again.', 4000); renderStatus(); return; }
      var c2 = counts();
      clearDraft(); state.submitted = { done: c2.done, total: c2.total, photos: c2.saved, message: r.message || '' }; render();
    }).catch(function (e) {
      state.submitting = false; renderStatus();
      if (e && e.code === 'expired') return renderMessage('This link has expired', 'Nothing is lost. Open the checklist again from Airtable to finish and submit it.');
      toast('No connection — nothing was lost. Tap Submit again when you have signal.', 4500);
    });
  }
  window.addEventListener('beforeunload', function (e) {
    if (!state.submitted && counts().pending) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- start ----------
  function renderMessage(title, msg) {
    $('app').innerHTML = '<div class="done-screen"><h1 style="font-size:21px;margin:0 0 10px">' + esc(title) + '</h1><p style="color:#5f6368">' + esc(msg) + '</p></div>';
  }
  function start() {
    KEY = 'captiva-cl-' + M.taskId;
    if (M.closed) return renderMessage(M.pending ? 'Checklist submitted' : 'This checklist is closed', M.pending ? 'It is being filed in the job folder now.' : 'It has already been submitted or is no longer open.');
    if (M.pending) return renderMessage('Checklist submitted', 'It is being filed in the job folder now. You can close this page.');
    document.title = M.job + ' \u2014 ' + M.title;
    if (LINK && !LINK.u && !WHO) return pickWho(false, start);
    var resumed = loadDraft();
    (M.staged || []).forEach(function (s) { state.photos.push({ clientId: s.clientId, id: s.id, takenAt: s.takenAt, status: 'saved', thumb: s.thumb || null }); });
    render();
    var n = (M.staged || []).length;
    if (resumed || n) { draftState = 'saved'; renderSaved(); toast('Picking up where you left off' + (n ? ' \u2014 ' + n + ' photo' + (n === 1 ? '' : 's') + ' already saved' : '') + '.', 3500); }
  }
  // Who is filling this out (direct links only): the one assigned person automatically; otherwise the
  // person this phone picked before (if they are allowed on this checklist); otherwise ask once.
  function readWho() { try { return JSON.parse(localStorage.getItem(WHO_KEY) || 'null'); } catch (e) { return null; } }
  function pickWho(force, then) {
    var people = M.people || [], team = M.team || [], saved = readWho();
    var has = function (list, w) { return !!w && list.some(function (x) { return x.email === w.email; }); };
    if (!force) {
      if (people.length === 1) { WHO = people[0]; return then(); }
      if (saved && (people.length ? has(people, saved) : has(team, saved))) { WHO = saved; return then(); }
    }
    var first = people.length ? people : team;
    var btn = function (x, i, list) { return '<button class="btn alt who" data-l="' + list + '" data-i="' + i + '" style="margin-top:10px;font-size:17px;padding:15px">' + esc(x.name) + '</button>'; };
    $('app').innerHTML = '<div class="done-screen" style="padding-top:40px"><h1 style="font-size:21px;margin:0 0 6px">Who\u2019s filling this out?</h1>' +
      '<p style="color:#5f6368;margin:0 0 14px">' + esc(M.job) + ' \u00b7 ' + esc(M.title) + '<br>This phone will remember your answer.</p>' +
      first.map(function (x, i) { return btn(x, i, 'first'); }).join('') +
      (people.length ? '<button class="btn alt" id="someoneElse" style="margin-top:18px;background:none">Someone else</button><div id="others" style="display:none">' +
        team.filter(function (x) { return !has(people, x); }).map(function (x, i) { return btn(x, i, 'others'); }).join('') + '</div>' : '') + '</div>';
    var lists = { first: first, others: team.filter(function (x) { return !has(people, x); }) };
    Array.prototype.forEach.call(document.querySelectorAll('button.who'), function (b) {
      b.addEventListener('click', function () {
        WHO = lists[b.getAttribute('data-l')][+b.getAttribute('data-i')];
        try { localStorage.setItem(WHO_KEY, JSON.stringify(WHO)); } catch (e) {}
        then();
      });
    });
    if ($('someoneElse')) $('someoneElse').addEventListener('click', function () { $('someoneElse').style.display = 'none'; $('others').style.display = 'block'; });
  }
  var embedded = null;
  try { var raw = $('model').textContent.trim(); if (raw && raw.charAt(0) === '{') embedded = JSON.parse(raw); } catch (e) {}
  if (embedded) { M = embedded; start(); return; }
  // Mode B: signed link in the address → load the checklist from the API.
  var q = new URLSearchParams(location.search);
  LINK = { t: q.get('t') || '', s: q.get('s') || '' };
  if (q.get('u') || q.get('x')) { LINK.u = q.get('u') || ''; LINK.x = q.get('x') || ''; }   // signed after Google sign-in
  var dep = q.get('a') || '';
  if (!/^rec[A-Za-z0-9]{14}$/.test(LINK.t) || !LINK.s || !/^[A-Za-z0-9_-]{20,120}$/.test(dep)) return renderMessage('Checklist link is incomplete', 'Go back to Airtable and tap Open checklist again.');
  API = 'https://script.google.com/macros/s/' + dep + '/exec';
  renderMessage('Loading checklist\u2026', '');
  post('load', {}).then(function (m) { M = m; M.taskId = M.taskId || LINK.t; start(); })
    .catch(function (e) {
      if (e && e.code === 'expired') return renderMessage('This link has expired', 'Open the checklist again from Airtable. Anything you already saved is still there.');
      if (e && (e.code === 'bad-link' || e.code === 'not-found')) return renderMessage('Checklist not found', 'Go back to Airtable and tap Open checklist again.');
      renderMessage('No connection', 'Could not load the checklist. Check your signal and reload this page.');
    });
})();
</script>
</body>
